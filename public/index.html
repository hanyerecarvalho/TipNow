<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TipNow — Calculadora de gorjetas</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Arial, Helvetica, sans-serif;
            color: #172a23;
            background: linear-gradient(145deg, #e3f5eb, #f8faf8 65%);
        }

        main {
            width: min(100%, 480px);
            padding: clamp(24px, 6vw, 40px);
            background: #fff;
            border: 1px solid #dce8e1;
            border-radius: 24px;
            box-shadow: 0 16px 48px #18392b14;
        }

        .marca {
            display: inline-block;
            padding: 7px 12px;
            border-radius: 999px;
            background: #def4e8;
            color: #135c3d;
            font-size: 14px;
            font-weight: bold;
        }

        h1 {
            margin: 16px 0 8px;
            font-size: clamp(28px, 6vw, 36px);
            letter-spacing: -0.03em;
        }

        .descricao {
            margin: 0 0 28px;
            color: #4c6056;
            line-height: 1.5;
        }

        form, .campo {
            display: grid;
            gap: 8px;
        }

        form {
            gap: 18px;
        }

        .linha {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        label {
            font-size: 14px;
            font-weight: bold;
        }

        .entrada {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 12px;
            border: 1px solid #889e91;
            border-radius: 10px;
            background: #f7faf8;
        }

        .entrada:focus-within {
            outline: 2px solid #247d56;
            outline-offset: 2px;
        }

        .unidade {
            color: #42594e;
            font-size: 14px;
        }

        input {
            width: 100%;
            min-width: 0;
            min-height: 48px;
            border: 0;
            outline: 0;
            background: transparent;
            color: inherit;
            font: inherit;
        }

        button {
            min-height: 48px;
            margin-top: 4px;
            border: 0;
            border-radius: 10px;
            background: #176143;
            color: #fff;
            font: inherit;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #104a33;
        }

        button:focus-visible {
            outline: 2px solid #247d56;
            outline-offset: 3px;
        }

        @media (max-width: 420px) {
            .linha {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main>
        <span class="marca">TipNow</span>
        <h1>Divida a conta</h1>
        <p class="descricao">
            Informe o valor da conta e a gorjeta para saber quanto cada pessoa paga.
        </p>

        <form action="/calculo" method="post">
            <div class="campo">
                <label for="valor">Valor da conta</label>
                <div class="entrada">
                    <span class="unidade" aria-hidden="true">R$</span>
                    <input id="valor" name="valor" type="number"
                           min="0.01" step="0.01" inputmode="decimal"
                           placeholder="200,00" required>
                </div>
            </div>

            <div class="linha">
                <div class="campo">
                    <label for="gorjeta">Gorjeta (%)</label>
                    <div class="entrada">
                        <input id="gorjeta" name="gorjeta" type="number"
                               min="0" step="1" inputmode="numeric"
                               value="10" required>
                        <span class="unidade" aria-hidden="true">%</span>
                    </div>
                </div>

                <div class="campo">
                    <label for="qtdPessoas">Número de pessoas</label>
                    <div class="entrada">
                        <input id="qtdPessoas" name="qtdPessoas" type="number"
                               min="1" step="1" inputmode="numeric"
                               value="1" required>
                    </div>
                </div>
            </div>

            <button type="submit">Calcular divisão</button>
        </form>
    </main>
</body>
</html>
